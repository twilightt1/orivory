name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and infra-free tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full-repo lint
        run: python -m ruff check app tests eval scripts

      - name: Run API tests
        run: python -m pytest --confcutdir=tests/api tests/api/test_health_api.py tests/api/test_sse.py tests/api/test_admin_diagnostics.py tests/api/test_insights_refresh.py -q

      - name: Run service tests
        run: python -m pytest --confcutdir=tests/services tests/services/test_health_service.py tests/services/test_diagnostics_service.py tests/services/test_referral_service.py -q

      - name: Run RAG tests
        run: |
          python -m pytest --confcutdir=tests/rag \
            tests/rag/test_graph_routing.py \
            tests/rag/test_evaluation.py \
            tests/rag/test_integration.py \
            tests/rag/test_ai_hardening.py \
            -q

      - name: Run evaluation tests
        run: python -m pytest --confcutdir=tests/eval tests/eval/test_eval_metrics.py tests/eval/test_live_api_eval.py tests/eval/test_llm_judge_provenance.py -q

      - name: Run schema-fidelity tests (migrations vs models, DB-free)
        run: python -m pytest --confcutdir=tests/migrations tests/migrations -q

      - name: Run middleware unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/middleware tests/middleware -q

      - name: Run script unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/scripts tests/scripts -q

      - name: Run agent unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/agents tests/agents/test_llm_client_loop.py -q

      - name: Run retrieval unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_embedding_dim_guard.py tests/retrieval/test_vector_store.py tests/retrieval/test_scoring.py -q

      - name: Run benchmark unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/benchmarks tests/benchmarks -q

      - name: Run config tests
        run: python -m pytest --confcutdir=tests/config tests/config/test_settings_validation.py -q

      - name: Run Hub unit tests (DB-free)
        run: |
          python -m pytest --confcutdir=tests/mcp_hub tests/mcp_hub -q
          python -m pytest --confcutdir=tests/models tests/models -q
          python -m pytest --confcutdir=tests/services tests/services/test_agent_token_service.py tests/services/test_access_ledger_service.py -q
          python -m pytest --confcutdir=tests/api tests/api/test_agents_router.py tests/api/test_router_wiring.py -q

      - name: Run evaluation smoke
        run: python eval/run_eval.py --mode offline --output-dir eval/results --top-k 5

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Validate production Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: frontend
        run: pnpm run build

  lint-full:
    name: Full-repo ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full-repo ruff
        run: python -m ruff check app tests eval scripts

  security-check:
    name: Security readiness gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run security_check.py
        run: python scripts/security_check.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: |
          python -m pip_audit --requirement requirements.txt --requirement requirements-dev.txt --desc --format columns || true

      - name: Check for critical vulnerabilities
        run: |
          python -m pip_audit --requirement requirements.txt --requirement requirements-dev.txt -f json > pip-audit.json || true
          
          if grep -q 'CRITICAL' pip-audit.json 2>/dev/null; then
            echo "⚠️  Critical severity vulnerabilities found!"
            cat pip-audit.json
            echo ""
            echo "Please review and update affected packages."
          else
            echo "✅ No critical severity vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30

  integration:
    name: Live service integration tests
    runs-on: ubuntu-latest

    env:
      RUN_LIVE_INTEGRATION: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:55432/ragdb
      POSTGRES_PORT: "55432"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      REDIS_URL: redis://localhost:6379/0
      REDIS_POOL_MAX: "10"
      JWT_SECRET_KEY: test-secret-key-change-in-production
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rag-docs
      MINIO_SECURE: "false"
      CHROMA_HOST: localhost
      CHROMA_PORT: "8001"
      OPENROUTER_API_KEY: test-openrouter-key
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: openai/gpt-4o-mini
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "512"
      OPENAI_API_KEY: test-openai-key
      EMBED_MODEL: text-embedding-3-small
      EMBED_DIMENSIONS: "1536"
      EMBED_BATCH_SIZE: "64"
      JINA_API_KEY: test-jina-key
      JINA_RERANKER_MODEL: jina-reranker-v2-base-multilingual
      JINA_RERANKER_TOP_N: "5"
      EVALUATOR_FAILURE_MODE: warn_only
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RATE_LIMIT_PER_MINUTE: "600"
      RATE_LIMIT_PER_DAY: "10000"
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Start live services
        run: docker compose up -d postgres redis chromadb minio

      - name: Wait for live services
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            docker compose exec -T postgres pg_isready -U postgres -d ragdb \
              && docker compose exec -T redis redis-cli ping \
              && curl -fsS http://localhost:8001/api/v2/heartbeat >/dev/null \
              && curl -fsS http://localhost:9000/minio/health/live >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs postgres redis chromadb minio
          exit 1

      - name: Run migrations
        run: docker compose run --rm migrate

      - name: Run live integration tests
        run: python -m pytest --confcutdir=tests/integration tests/integration -q

      - name: Stop live services
        if: always()
        run: docker compose down -v

  smoke-tests:
    name: Smoke tests (Docker Compose services)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.title, 'smoke') || contains(github.event.pull_request.title, 'infrastructure')

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/ragdb
      POSTGRES_PORT: "5432"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      REDIS_URL: redis://localhost:6379/0
      REDIS_POOL_MAX: "10"
      JWT_SECRET_KEY: test-secret-key-change-in-production
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: rag-docs
      MINIO_SECURE: "false"
      CHROMA_HOST: localhost
      CHROMA_PORT: "8001"
      OPENROUTER_API_KEY: test-openrouter-key
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: openai/gpt-4o-mini
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "512"
      OPENAI_API_KEY: test-openai-key
      EMBED_MODEL: text-embedding-3-small
      EMBED_DIMENSIONS: "1536"
      EMBED_BATCH_SIZE: "64"
      JINA_API_KEY: test-jina-key
      JINA_RERANKER_MODEL: jina-reranker-v2-base-multilingual
      JINA_RERANKER_TOP_N: "5"
      EVALUATOR_FAILURE_MODE: warn_only
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      RATE_LIMIT_PER_MINUTE: "600"
      RATE_LIMIT_PER_DAY: "10000"
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install psycopg2-binary redis requests

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Start all services
        run: docker compose up -d

      - name: Wait for services to be healthy
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if docker compose exec -T postgres pg_isready -U postgres -d ragdb 2>/dev/null && \
               docker compose exec -T redis redis-cli ping 2>/dev/null && \
               curl -fsS http://localhost:8001/api/v2/heartbeat >/dev/null 2>&1 && \
               curl -fsS http://localhost:9000/minio/health/live >/dev/null 2>&1; then
              echo "All services healthy!"
              exit 0
            fi
            echo "Waiting for services... ($i/90)"
            sleep 2
          done
          echo "Service startup timeout"
          docker compose ps
          docker compose logs postgres redis chromadb minio
          exit 1

      - name: Run smoke tests
        run: python -m pytest tests/smoke -v -m smoke --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ragdb

      - name: Stop services
        if: always()
        run: docker compose down -v
