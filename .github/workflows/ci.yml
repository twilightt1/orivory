name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and infra-free tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full-repo lint
        run: python -m ruff check app tests eval scripts

      - name: Run API tests
        run: python -m pytest --confcutdir=tests/api tests/api/test_health_api.py tests/api/test_sse.py tests/api/test_admin_diagnostics.py -q

      - name: Run service tests
        run: python -m pytest --confcutdir=tests/services tests/services/test_health_service.py tests/services/test_diagnostics_service.py tests/services/test_referral_service.py tests/services/test_storage_fs.py -q

      - name: Run RAG tests
        run: python -m pytest --confcutdir=tests/rag tests/rag -q

      - name: Run evaluation tests
        run: python -m pytest --confcutdir=tests/eval tests/eval/test_eval_metrics.py tests/eval/test_live_api_eval.py tests/eval/test_llm_judge_provenance.py -q

      - name: Run schema-fidelity tests (migrations vs models, DB-free)
        run: python -m pytest --confcutdir=tests/migrations tests/migrations -q

      - name: Run middleware unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/middleware tests/middleware -q

      - name: Run script unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/scripts tests/scripts -q

      - name: Run agent unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/agents tests/agents/test_llm_client_loop.py -q

      - name: Run retrieval unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_embedding_dim_guard.py tests/retrieval/test_vector_store.py tests/retrieval/test_scoring.py -q

      - name: Run P1a durable-canonical gate tests (temp SQLite file, no services)
        env:
          # Lite semantics, set explicitly: these modules assert the SQLite-shaped
          # outbox / visibility / erasure paths, so no ambient default may
          # silently stand in (test_index_outbox is lite-gated by ruling).
          DATABASE_URL: sqlite+aiosqlite:////tmp/p1a_ci.db
        run: |
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_p1a_gate.py tests/retrieval/test_index_outbox.py tests/retrieval/test_visibility.py tests/retrieval/test_contract_errors.py -q
          python -m pytest --confcutdir=tests/services tests/services/test_durable_erasure.py -q

      - name: Run P1b Qdrant + migration suites (temp SQLite, no services)
        env:
          # Lite semantics, same as the P1a gate step: every module here opens
          # its own private SQLite file + private embedded-Qdrant folder, so no
          # compose service is involved. tests/migration's rollback module
          # self-skips on the missing chromadb (it runs from the isolated
          # requirements-rollback.txt venv, not from CI's runtime env), and the
          # Postgres cutover smoke self-skips without a PG DATABASE_URL (the
          # integration job runs it).
          DATABASE_URL: sqlite+aiosqlite:////tmp/p1b_ci.db
        run: |
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_qdrant_backend.py tests/retrieval/test_qdrant_parity.py tests/retrieval/test_chunk_index.py tests/retrieval/test_cls_cutover.py tests/retrieval/test_p1b_gate.py -q
          python -m pytest --confcutdir=tests/lite tests/lite/test_readiness_lite.py -q
          python -m pytest --confcutdir=tests/migration tests/migration -q

      - name: Run P3 background-indexing suites (temp SQLite, no services)
        env:
          # Same discipline as the P1a/P1b steps above: every module opens its
          # own private SQLite file and its own embedded-Qdrant folder, so no
          # compose service is involved. These are the P3 suites that had no CI
          # step of their own — the drain loop, the recall freshness barrier,
          # the drain races, the erasure service and its receipt reconcile, the
          # lite schema/parity/bootstrap ladder, the correction roundtrip and
          # the purge fence.
          DATABASE_URL: sqlite+aiosqlite:////tmp/p3_ci.db
        run: |
          python -m pytest --confcutdir=tests/services tests/services/test_erasure_service.py tests/services/test_diagnostics_outbox.py tests/services/test_erasure_reconcile.py -q
          python -m pytest --confcutdir=tests/lite tests/lite/test_sqlite_schema_v3.py tests/lite/test_sqlite_sync_parity.py tests/lite/test_correction_roundtrip.py tests/lite/test_sqlite_bootstrap.py -q
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_drain_loop.py tests/retrieval/test_freshness_barrier.py tests/retrieval/test_drain_races.py tests/retrieval/test_p3_gate.py -q
          python -m pytest --confcutdir=tests/rag tests/rag/test_pipeline_purge_fence.py -q

      - name: Run P2 retrieval/hybrid suites (temp SQLite, no services)
        env:
          # Same discipline as the P1a/P1b/P3 steps above: every module here
          # opens its own private SQLite file + private embedded-Qdrant folder
          # (the P1b gate's store, reused as a plugin), so no compose service is
          # involved. Explicit paths on purpose — a new suite never runs unless
          # it is listed. The P2 gate itself is tests/retrieval/test_p2_gate.py
          # (§9 acceptance row); the last line is the batch of retrieval /
          # observability suites that had no CI step of their own before P2,
          # and the event-loop heartbeat + ablation-contract modules carry
          # their own cold-cache guards (arctic onnx cache missing → skip).
          DATABASE_URL: sqlite+aiosqlite:////tmp/p2_ci.db
        run: |
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_p2_gate.py tests/retrieval/test_rerank_pool.py tests/retrieval/test_hybrid_recall.py -q
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_event_loop_responsiveness.py tests/retrieval/test_p2_ablation_contract.py -q
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_semantic_rerank.py tests/retrieval/test_p0_final_safety.py tests/retrieval/test_retriever_filters.py tests/retrieval/test_e5_local.py tests/retrieval/test_embedding_fingerprint.py tests/retrieval/test_vector_degradation.py tests/retrieval/test_xs_parity.py tests/retrieval/test_graph_build_offload.py -q
          python -m pytest --confcutdir=tests/observability tests/observability -q

      - name: Run P1b mean-vs-CLS ablation (evidence artifact, never a gate)
        env:
          # An empty model dir on purpose: the script SKIPs (exit 0) instead of
          # downloading ~90MB of ONNX, so this step pins that the ablation RUNS
          # cleanly. The measured numbers live in the committed
          # eval/ablation_mean_vs_cls.json, produced on a machine with the cache.
          LOCAL_E5_DIR: /tmp/orivory-ablation-models
        run: python eval/ablation_mean_vs_cls.py

      - name: Run P2 retrieval ablation + its contract test
        # Never a gate: the artifact is the evidence, the contract test pins its
        # SHAPE (arms/slices/verdicts), and the script itself refuses to
        # download the ~90MB arctic ONNX on a cold runner — so the step runs it
        # when the cache is warm and says why it skipped when it is not. Only an
        # explicit verdict acts: a failing probe (missing dependency, broken
        # import) FAILS the step, only 'cold' prints the skip line, and any
        # other output FAILS it too — nothing is reported as a cold cache that
        # did not say 'cold'. Before P2 this script and its contract test
        # appeared in no CI step at all.
        run: |
          python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_p2_ablation_contract.py -q
          if ! cache="$(python -c "from app.retrieval import e5_local; print('cached' if e5_local.arctic_files_cached() else 'cold')")"; then
            echo "the arctic cache probe itself failed — not a cold cache" >&2
            exit 1
          fi
          case "$cache" in
            cached)
              python eval/ablation_retrieval_p2.py
              ;;
            cold)
              echo "arctic artifacts not cached → the ablation SKIPS; eval/ablation_retrieval_p2.json is the committed evidence"
              ;;
            *)
              echo "the arctic cache probe printed an unexpected verdict '$cache' — only 'cold' may skip" >&2
              exit 1
              ;;
          esac

      - name: Run benchmark unit tests (DB-free)
        run: python -m pytest --confcutdir=tests/benchmarks tests/benchmarks -q

      - name: Run config tests
        run: python -m pytest --confcutdir=tests/config tests/config/test_settings_validation.py -q

      - name: Run SQLite schema-adoption + v2 ladder tests (DB-free)
        run: python -m pytest --confcutdir=tests/lite tests/lite/test_sqlite_schema_adoption.py tests/lite/test_sqlite_schema_v2.py -q

      - name: Run Hub unit tests (DB-free)
        run: |
          python -m pytest --confcutdir=tests/mcp_hub tests/mcp_hub -q
          python -m pytest --confcutdir=tests/models tests/models -q
          python -m pytest --confcutdir=tests/services tests/services/test_agent_token_service.py tests/services/test_access_ledger_service.py -q
          python -m pytest --confcutdir=tests/api tests/api/test_agents_router.py tests/api/test_router_wiring.py -q

      - name: Run evaluation smoke
        run: python eval/run_eval.py --mode offline --output-dir eval/results --top-k 5

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Validate Docker Compose config
        run: docker compose config --quiet

      - name: Validate production Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  lint-full:
    name: Full-repo ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full-repo ruff
        run: python -m ruff check app tests eval scripts

  security-check:
    name: Security readiness gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run security_check.py
        run: python scripts/security_check.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Run pip-audit
        run: |
          python -m pip_audit --requirement requirements.txt --requirement requirements-dev.txt --desc --format columns || true

      - name: Check for critical vulnerabilities
        run: |
          python -m pip_audit --requirement requirements.txt --requirement requirements-dev.txt -f json > pip-audit.json || true
          
          if grep -q 'CRITICAL' pip-audit.json 2>/dev/null; then
            echo "⚠️  Critical severity vulnerabilities found!"
            cat pip-audit.json
            echo ""
            echo "Please review and update affected packages."
          else
            echo "✅ No critical severity vulnerabilities found"
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit.json
          retention-days: 30

  integration:
    name: Live service integration tests
    runs-on: ubuntu-latest

    env:
      RUN_LIVE_INTEGRATION: "1"
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:55432/ragdb
      POSTGRES_PORT: "55432"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      # Slim core: Redis/MinIO services were dropped — in-process Redis + fs storage.
      REDIS_URL: ""
      JWT_SECRET_KEY: test-secret-key-change-in-production
      STORAGE_BACKEND: fs
      FS_STORAGE_PATH: /tmp/orivory-ci-storage
      QDRANT_URL: http://localhost:6333
      OPENROUTER_API_KEY: test-openrouter-key
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: openai/gpt-4o-mini
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "512"
      OPENAI_API_KEY: test-openai-key
      EMBED_MODEL: text-embedding-3-small
      EMBED_DIMENSIONS: "1536"
      EMBED_BATCH_SIZE: "64"
      JINA_API_KEY: test-jina-key
      JINA_RERANKER_MODEL: jina-reranker-v2-base-multilingual
      # R13: the per-call CAP, kept at the shipped default — CI is not a
      # deployment, and a pre-R13 5 here is the same stale default the
      # example files carried.
      JINA_RERANKER_TOP_N: "20"
      EVALUATOR_FAILURE_MODE: warn_only
      RATE_LIMIT_PER_MINUTE: "600"
      RATE_LIMIT_PER_DAY: "10000"
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Start live services
        run: docker compose up -d postgres qdrant

      - name: Wait for live services
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            docker compose exec -T postgres pg_isready -U postgres -d ragdb \
              && curl -fsS http://localhost:6333/readyz >/dev/null \
              && exit 0
            sleep 2
          done
          docker compose ps
          docker compose logs postgres qdrant
          exit 1

      - name: Run migrations
        run: docker compose run --rm migrate

      - name: Run live integration tests
        run: python -m pytest --confcutdir=tests/integration tests/integration -q

      - name: Run P1b Postgres cutover smoke
        # The one path the SQLite suites cannot reach: scripts/migrate_qdrant.py
        # against Postgres, where database.activate_generations IS the expand and
        # cutover is the pointer flip. Skips silently without a PG DATABASE_URL.
        run: python -m pytest --confcutdir=tests/migration tests/migration/test_p1b_pg_smoke.py -q

      - name: Run P1b Qdrant parity against the live server
        # The module the infra-free step runs against an embedded folder, here
        # in server mode against the compose qdrant service (QDRANT_URL from the
        # job env): the real HTTP data path — payload indexes + guard reads —
        # that the local mode cannot exercise. The env fixture takes the mode
        # from QDRANT_MODE/QDRANT_URL, so no test edit is needed here.
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/p1b_parity_server.db
          QDRANT_MODE: server
        run: python -m pytest --confcutdir=tests/retrieval tests/retrieval/test_qdrant_parity.py -q

      - name: Stop live services
        if: always()
        run: docker compose down -v

  smoke-tests:
    name: Smoke tests (Docker Compose services)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || contains(github.event.pull_request.title, 'smoke') || contains(github.event.pull_request.title, 'infrastructure')

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/ragdb
      POSTGRES_PORT: "5432"
      DATABASE_POOL_SIZE: "5"
      DATABASE_MAX_OVERFLOW: "5"
      # Slim core: Redis/MinIO services were dropped — in-process Redis + fs storage.
      REDIS_URL: ""
      JWT_SECRET_KEY: test-secret-key-change-in-production
      STORAGE_BACKEND: fs
      FS_STORAGE_PATH: /tmp/orivory-ci-storage
      QDRANT_URL: http://localhost:6333
      OPENROUTER_API_KEY: test-openrouter-key
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      LLM_MODEL: openai/gpt-4o-mini
      LLM_TEMPERATURE: "0.3"
      LLM_MAX_TOKENS: "512"
      OPENAI_API_KEY: test-openai-key
      EMBED_MODEL: text-embedding-3-small
      EMBED_DIMENSIONS: "1536"
      EMBED_BATCH_SIZE: "64"
      JINA_API_KEY: test-jina-key
      JINA_RERANKER_MODEL: jina-reranker-v2-base-multilingual
      # R13: the per-call CAP, kept at the shipped default — CI is not a
      # deployment, and a pre-R13 5 here is the same stale default the
      # example files carried.
      JINA_RERANKER_TOP_N: "20"
      EVALUATOR_FAILURE_MODE: warn_only
      RATE_LIMIT_PER_MINUTE: "600"
      RATE_LIMIT_PER_DAY: "10000"
      FRONTEND_URL: http://localhost:5173
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      ENVIRONMENT: test
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install psycopg2-binary requests

      - name: Prepare Docker Compose env
        run: cp .env.test.example .env

      - name: Start services
        # The compose flow starts postgres + qdrant, then the one-shot
        # `migrate` service, then `app` (depends_on: migrate completed). The
        # smoke job must run the whole stack: TestAPIHealth's checks against
        # localhost:8000 were a silent skip while only the two data services
        # came up.
        run: docker compose up -d

      - name: Wait for services to be healthy
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..90}; do
            if docker compose exec -T postgres pg_isready -U postgres -d ragdb 2>/dev/null && \
               curl -fsS http://localhost:6333/readyz >/dev/null 2>&1 && \
               curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "All services healthy!"
              exit 0
            fi
            echo "Waiting for services... ($i/90)"
            sleep 2
          done
          echo "Service startup timeout"
          docker compose ps
          docker compose logs postgres qdrant migrate app
          exit 1

      - name: Run smoke tests
        run: python -m pytest tests/smoke -v -m smoke --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/ragdb

      - name: Stop services
        if: always()
        run: docker compose down -v
