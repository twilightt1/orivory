# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The lite stack has no internal services to hide: the only published port is
# the API's own 8000, loopback-only on the host. `!override` REPLACES the
# sequence (Compose merges sequences otherwise), so the dev bind mount of
# ./data cannot survive into prod — the deployment writes into a named volume
# instead — and the published port is pinned to 127.0.0.1 either way.
services:
  app:
    environment:
      ENVIRONMENT: production
    ports: !override
      - "127.0.0.1:8000:8000"
    volumes: !override
      - orivory-data:/data
    # Embedded Qdrant is owned by exactly ONE process (the store folder is
    # locked): a second worker dies on its first write. Keep workers at 1.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1

volumes:
  orivory-data:
