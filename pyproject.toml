[project]
name = "orivory"
version = "1.1.0"
description = "Personal memory layer: ingest, connect, and recall knowledge with retrieval-augmented agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "authlib>=1.3.1",
    "bcrypt>=4.1.2",
    "beautifulsoup4>=4.12.0",
    "celery[redis]>=5.4.0",
    "chromadb>=0.5.5",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "flower>=2.0.1",
    "httpx>=0.27.0",
    "langchain>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langgraph>=0.2.0",
    "minio>=7.2.8",
    "mcp>=1.9.0,<2",
    "numpy>=1.26.4",
    "openai>=1.51.0",
    "pdfplumber>=0.11.0",
    "psycopg2-binary>=2.9.9",
    "pydantic-settings>=2.4.0",
    "pydantic[email]>=2.8.2",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sendgrid>=6.11.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "structlog>=24.4.0",
    "uvicorn[standard]>=0.30.6",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["notebooks", "sample_docs"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle errors
    "F",                # pyflakes (undefined names, unused imports, bad strings)
    "I",                # import sorting
    "B",                # bugbear (real bug patterns)
    "UP",               # pyupgrade (stale syntax)
    "RUF",              # ruff-specific
    "W",                # warnings (unused whitespace etc.)
]
ignore = [
    "B008",   # function call in argument defaults — FastAPI Depends() pattern
    "BLE001", # blind except — deliberate resilience pattern in this codebase (tracked separately)
    "S110",   # try-except-pass — same
    "RUF001", # ambiguous unicode in string — decorative section headers
    "RUF002", # ambiguous unicode in docstring — same
    "RUF003", # ambiguous unicode in comment — same
    "RUF012", # mutable class attrs need ClassVar — ORM/Pydantic noise
    "RUF022", # unsorted __all__ — style
    "UP042",  # StrEnum migration — deferred
]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap must run before imports
"eval/run_eval.py" = ["E402"]
"eval/run_benchmark.py" = ["E402"]
"eval/run_judge_only.py" = ["E402"]
"scripts/security_check.py" = ["E402"]
"tests/agents/test_cost_helpers.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.1",
    "mypy>=1.11.1",
]

