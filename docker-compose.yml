# The lite stack — ONE container, zero external services: SQLite canonical
# store, in-process (embedded) Qdrant, in-memory caches, filesystem uploads,
# background work eager in-process. Celery/Redis/MinIO/Flower and the
# Postgres/Qdrant servers were dropped on the slim branch.
#
#   docker compose up -d          # http://127.0.0.1:8000  (MCP: /mcp)
#
# The host directory below holds EVERYTHING stateful — the paths come from
# app/config.py: /data/orivory.db (SQLite), /data/qdrant (embedded Qdrant),
# /data/uploads (uploaded files). On a Linux host make it writable by the
# image's `app` user before the first boot:  mkdir -p data && chmod 777 data
#
# The API binds 127.0.0.1 on the HOST (loopback only) — put a reverse proxy in
# front of it to expose it. The container itself listens on 0.0.0.0.
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Pinned so a stale .env cannot silently retarget the store
      # (env_file values lose to this block).
      DATABASE_URL: sqlite+aiosqlite:////data/orivory.db
      QDRANT_MODE: local
      QDRANT_LOCAL_PATH: /data/qdrant
      STORAGE_BACKEND: fs
      FS_STORAGE_PATH: /data/uploads
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
